# dhcpd.conf — DHCP server configuration for ${BASE_DOMAIN}
#
# Generated from this template by envsubst during nuc-00-01 post_install.
# Variables are resolved from Scripts/env.sh at install time.
#
# This DHCP server is on nuc-00-01 (10.10.12.8) and serves the full /22
# supernet covering all four environments:
#
#   10.10.12.0/24  homelab   — shared infrastructure (DNS, DHCP, admin, NAS)
#   10.10.13.0/24  enclave   — nuc-01/02/03 (air-gapped via Harbor)
#   10.10.14.0/24  community — nuc-01/02/03 (Gen13 NUCs, public registries)
#   10.10.15.0/24  carbide   — nuc-01/02/03 (RGS registry)
#
# Each /24 reserves .228-.254 as a dynamic pool. Fixed hosts declared below.
# Domain per host group (all use nuc-01/02/03; domain differentiates environments):
#   carbide nuc-01/02/03 → per-host override: carbide.kubernerdes.com
#   enclave nuc-01/02/03 → per-host override: enclave.kubernerdes.com
#   community nuc-01/02/03 → per-host override: community.kubernerdes.com
#   This is done via ISC DHCP's per-host "option domain-name" override.
#
# Supernet: ${SUBNET_CIDR}
# Domain:   ${BASE_DOMAIN}
# DNS:      ${DNS1_IP}, ${DNS2_IP}
# DHCP pool: ${DHCP_RANGE_START} – ${DHCP_RANGE_END}

# iPXE option definitions
option space pxelinux;
option pxelinux.magic code 208 = string;
option pxelinux.configfile code 209 = text;
option pxelinux.pathprefix code 210 = text;
option pxelinux.reboottime code 211 = unsigned integer 32;
option architecture-type code 93 = unsigned integer 16;

# Global options — domain is ${BASE_DOMAIN} (resolved by envsubst at install time)
option domain-name "${BASE_DOMAIN}";
option domain-name-servers ${DNS1_IP}, ${DNS2_IP};
default-lease-time 7200;
max-lease-time 7200;
authoritative;

# Subnet declaration — covers the full 10.10.12.0/22 supernet
subnet ${SUPERNET_PREFIX}.0 netmask ${SUBNET_MASK} {
    option routers ${GATEWAY};
    option subnet-mask ${SUBNET_MASK};

    # Dynamic pools — each /24 reserves .228-.254 for ad-hoc clients
    pool { range 10.10.12.228 10.10.12.254; }  # homelab
    pool { range 10.10.13.228 10.10.13.254; }  # enclave
    pool { range 10.10.14.228 10.10.14.254; }  # community
    pool { range 10.10.15.228 10.10.15.254; }  # carbide

    # TFTP server for initial iPXE handoff
    next-server ${DNS1_IP};

    # UEFI boot: send iPXE binary, then redirect iPXE clients to menu
    if exists user-class and option user-class = "iPXE" {
        filename "http://${ADMIN_IP}/ipxe-menu";
    } else {
        filename "ipxe.efi";
    }
}

# ---------------------------------------------------------------------------
# Fixed hosts — primary cluster nodes (NUCxx_HOST/MAC/IP set by env.d/${ENVIRONMENT}.sh)
# Inherit global domain-name: ${BASE_DOMAIN}
# NUC0x_HOST and MACs are set per environment in Scripts/env.d/${ENVIRONMENT}.sh
# ---------------------------------------------------------------------------

host ${NUC01_HOST} {
    hardware ethernet ${NUC01_MAC};
    fixed-address ${NUC01_IP};
    option host-name "${NUC01_HOST}";
    if exists user-class and option user-class = "iPXE" {
        filename "http://${ADMIN_IP}/harvester/harvester/ipxe-menu";
    } else {
        filename "ipxe.efi";
    }
}

host ${NUC02_HOST} {
    hardware ethernet ${NUC02_MAC};
    fixed-address ${NUC02_IP};
    option host-name "${NUC02_HOST}";
    if exists user-class and option user-class = "iPXE" {
        filename "http://${ADMIN_IP}/harvester/harvester/ipxe-menu";
    } else {
        filename "ipxe.efi";
    }
}

host ${NUC03_HOST} {
    hardware ethernet ${NUC03_MAC};
    fixed-address ${NUC03_IP};
    option host-name "${NUC03_HOST}";
    if exists user-class and option user-class = "iPXE" {
        filename "http://${ADMIN_IP}/harvester/harvester/ipxe-menu";
    } else {
        filename "ipxe.efi";
    }
}

include "/etc/dhcpd.d/dhcpd-hosts.conf";
