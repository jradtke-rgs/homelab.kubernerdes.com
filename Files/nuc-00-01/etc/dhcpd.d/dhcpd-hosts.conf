# dhcpd-hosts.conf — Additional fixed DHCP host entries
#
# Included by dhcpd.conf. Add entries here for hosts beyond the 3 enclave
# Harvester nodes defined in the main config.
#
# Community NUCs (nuc-11/12/13) live in this file rather than dhcpd.conf
# because they are fixed across all environments and use a per-host
# domain-name override to receive "community.kubernerdes.com" instead of
# the global "enclave.kubernerdes.com".
#
# ISC DHCP per-host domain override: the "option domain-name" line inside
# a host block takes precedence over the global option for that client.

# ---------------------------------------------------------------------------
# Community cluster nodes (nuc-11/12/13, 10.10.14.0/24)
# Domain override: community.kubernerdes.com
# ---------------------------------------------------------------------------

host nuc-11 {
    hardware ethernet 48:21:0b:65:ce:e5;
    fixed-address 10.10.14.101;
    option host-name "nuc-11";
    option domain-name "community.kubernerdes.com";
    if exists user-class and option user-class = "iPXE" {
        filename "http://10.10.12.10/harvester/harvester/ipxe-menu";
    } else {
        filename "ipxe.efi";
    }
}

host nuc-12 {
    hardware ethernet 48:21:0b:65:c2:c7;
    fixed-address 10.10.14.102;
    option host-name "nuc-12";
    option domain-name "community.kubernerdes.com";
    if exists user-class and option user-class = "iPXE" {
        filename "http://10.10.12.10/harvester/harvester/ipxe-menu";
    } else {
        filename "ipxe.efi";
    }
}

host nuc-13 {
    hardware ethernet 48:21:0b:5d:7a:e6;
    fixed-address 10.10.14.103;
    option host-name "nuc-13";
    option domain-name "community.kubernerdes.com";
    if exists user-class and option user-class = "iPXE" {
        filename "http://10.10.12.10/harvester/harvester/ipxe-menu";
    } else {
        filename "ipxe.efi";
    }
}

