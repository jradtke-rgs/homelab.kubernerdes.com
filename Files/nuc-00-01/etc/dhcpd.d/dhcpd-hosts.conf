# dhcpd-hosts.conf — Additional fixed DHCP host entries
#
# Included by dhcpd.conf. Add entries here for hosts beyond the primary cluster
# nodes defined in the main config (those are templated via NUCxx_HOST vars).
#
# Enclave and community NUCs live here because they are fixed across environments
# and use per-host domain-name overrides (enclave.kubernerdes.com and
# community.kubernerdes.com) rather than inheriting the global ${BASE_DOMAIN}.
#
# ISC DHCP per-host domain override: the "option domain-name" line inside
# a host block takes precedence over the global option for that client.

# ---------------------------------------------------------------------------
# Enclave cluster nodes (nuc-01/02/03, 10.10.13.0/24)
# Domain override: enclave.kubernerdes.com
# TODO: fill in MAC addresses once enclave hardware is provisioned
# ---------------------------------------------------------------------------

host nuc-01-enclave {
    hardware ethernet TODO:enclave-nuc-01-mac;
    fixed-address 10.10.13.101;
    option host-name "nuc-01";
    option domain-name "enclave.kubernerdes.com";
    if exists user-class and option user-class = "iPXE" {
        filename "http://10.10.12.10/harvester/harvester/ipxe-menu";
    } else {
        filename "ipxe.efi";
    }
}

host nuc-02-enclave {
    hardware ethernet TODO:enclave-nuc-02-mac;
    fixed-address 10.10.13.102;
    option host-name "nuc-02";
    option domain-name "enclave.kubernerdes.com";
    if exists user-class and option user-class = "iPXE" {
        filename "http://10.10.12.10/harvester/harvester/ipxe-menu";
    } else {
        filename "ipxe.efi";
    }
}

host nuc-03-enclave {
    hardware ethernet TODO:enclave-nuc-03-mac;
    fixed-address 10.10.13.103;
    option host-name "nuc-03";
    option domain-name "enclave.kubernerdes.com";
    if exists user-class and option user-class = "iPXE" {
        filename "http://10.10.12.10/harvester/harvester/ipxe-menu";
    } else {
        filename "ipxe.efi";
    }
}

